const DIFERENCIAL = [

  ["Condición socioeconómica", "Reducir barreras de costos, tiempo y transporte; informar sobre rutas de atención."],

/* =========================================================

   ========================================================= */
const lista = (arr) => "<ul>" + arr.map(i => `<li>${esc(i)}</li>`).join("") + "</ul>";
const pares = (arr) => "<dl>" + arr.map(([t, d]) => `<dt><strong>${esc(t)}</strong></dt><dd>${esc(d)}</dd>`).join("") + "</dl>";

const PAGES = [
  { id: "inicio", title: "Inicio", landing: true,
    html: () => {
      const total = GROUPS.reduce((n, g) => n + g.items.length, 0);
      return `
      <h2>Cáncer de mama: conocer, prevenir y actuar</h2>
      <p>Toca el tema que te interese. Los que ya viste aparecen con ✓.</p>
      <p><button data-go="presentacion">Empezar por el principio</button>
         <button data-go="juego">Ir a los juegos</button></p>
      <div id="hub">
        ${GROUPS.map(g => `
          <section class="grupo grupo-${g.color}">
            <h3>${esc(g.name)}</h3>
            <div class="cards">
              ${g.items.map(([id, d]) => {
                const p = PAGES.find(x => x.id === id);
                return `<button class="card-btn" data-go="${id}"><strong>${visited.has(id) ? "✓ " : ""}${esc(p.title)}</strong><span>${esc(d)}</span></button>`;
              }).join("")}
            </div>
          </section>`).join("")}
      </div>
`;
    },
  },

  { id: "presentacion", title: "¿Qué es el cáncer de mama?",
    html: () => `
      <h2>Presentación del tema</h2>
      <h3>¿Qué es?</h3>
      <p>El cáncer de mama es una enfermedad en la que células del tejido mamario crecen de forma descontrolada y pueden formar un tumor.</p>
      <h3>¿Por qué importa?</h3>
      <p>Es uno de los cánceres más frecuentes en mujeres en el mundo y en Colombia. Detectarlo a tiempo mejora las opciones de tratamiento y la calidad de vida.</p>
      <h3>¿A quién puede afectar?</h3>
      <p>Principalmente a mujeres de cualquier etapa de la vida adulta, con mayor riesgo con la edad. También puede afectar a hombres (poco frecuente). Es especialmente relevante en mujeres de comunidades con menor acceso a servicios y en sobrevivientes.</p>
      <h3>¿Por qué es un tema de salud sexual y reproductiva?</h3>
      ${lista([
        "Fertilidad: algunos tratamientos pueden afectar la función ovárica.",
        "Función sexual: puede haber cambios en el deseo, la excitación, la lubricación y la satisfacción.",
        "Imagen corporal y bienestar emocional: cirugías, pérdida de cabello y cambios hormonales pueden afectar la autoestima.",
        "Derechos sexuales y reproductivos: acceso a información, consejería y apoyo psicosocial."
      ])}` },

  { id: "definiciones", title: "Glosario",
    html: () => `<h2>Definiciones y conceptos (glosario)</h2>${pares(GLOSARIO)}` },

  { id: "magnitud", title: "Cifras del problema",
    html: () => `
      <h2>Magnitud del problema</h2>
      <h3>Nivel mundial</h3>
      <ul>
        <li>En 2022 se diagnosticaron alrededor de 2,3 millones de casos de cáncer de mama y se registraron unas 670.000 muertes en el mundo. Población: mujeres a nivel mundial. Fuente: Organización Mundial de la Salud (2024), hoja informativa “Cáncer de mama”.</li>
      </ul>
      <h3>Colombia / Bogotá</h3>
      <p>El Ministerio de Salud y Protección Social reconoce el cáncer de mama como una de las principales causas de enfermedad y muerte por cáncer en mujeres del país.</p>
      <p><strong>Cifras locales:</strong> no se incluyen aquí cifras de incidencia o mortalidad para Colombia o Bogotá porque deben verificarse directamente en la fuente oficial (año, población, territorio y fuente). Consúltelas en:</p>
      <ul>
        <li><a href="https://www.minsalud.gov.co/salud/publica/ssr/paginas/cancer-de-mama.aspx" target="_blank" rel="noopener">Ministerio de Salud y Protección Social</a></li>
        <li><a href="https://www.cancer.gov.co" target="_blank" rel="noopener">Instituto Nacional de Cancerología</a></li>
        <li><a href="https://www.saludcapital.gov.co" target="_blank" rel="noopener">Secretaría Distrital de Salud de Bogotá</a></li>
      </ul>
      <p><em>Nota: si no hay datos locales disponibles, se usa el nivel geográfico más cercano.</em></p>` },

  { id: "riesgo", title: "Factores de riesgo y protectores",
    html: () => `
      <h2>Factores de riesgo y protectores</h2>
      <p>Seleccione una categoría:</p>

        <button data-tab="nomod">No modificables</button>

      </p>
      <div id="riesgo-contenido"></div>`,
    init: () => {
      const cont = $("#riesgo-contenido");
      const data = {
        nomod: ["Factores no modificables (biológicos)", lista(RIESGO_NO_MOD)],
        mod: ["Factores modificables (conductuales y reproductivos)", lista(RIESGO_MOD)],
        prot: ["Factores protectores", lista(PROTECTORES)],
        soc: ["Factores sociales, culturales, educativos y de acceso a servicios", lista([
          "Desconocimiento de los signos de alarma y de la importancia de la tamización.",
          "Miedo al diagnóstico y tabúes culturales.",
          "Barreras económicas, de tiempo o de transporte.",
          "Desconocimiento de las rutas de atención.",
          "Menor disponibilidad de servicios en algunos territorios."
        ])]
      };
      const show = (k) => { cont.innerHTML = `<h3>${data[k][0]}</h3>${data[k][1]}`; };
      document.querySelectorAll("[data-tab]").forEach(b => b.addEventListener("click", () => show(b.dataset.tab)));
      show("nomod");
    } },

  { id: "signos", title: "Señales de alerta",
    html: () => `
      <h2>Signos, síntomas y señales de alerta</h2>
      <p>Consulte a un servicio de salud si nota alguno de estos cambios:</p>
      ${lista(SIGNOS)}
      <p><strong>Importante:</strong> estos cambios no significan necesariamente que exista cáncer, pero requieren valoración profesional. Esta información no sirve para autodiagnosticarse.</p>` },

  { id: "prevencion", title: "Prevención",
    html: () => `
      <h2>Prevención y control</h2>
      <p>Seleccione el nivel de prevención:</p>
      <p>${PREVENCION.map((p, i) => `<button data-prev="${i}">${p.nivel}</button>`).join(" ")}</p>

      const cont = $("#prev-contenido");
      const show = (i) => { const p = PREVENCION[i]; cont.innerHTML = `<h3>Prevención ${p.nivel.toLowerCase()}</h3><p><em>${esc(p.pregunta)}</em></p>${lista(p.items)}`; };
      document.querySelectorAll("[data-prev]").forEach(b => b.addEventListener("click", () => show(+b.dataset.prev)));
      show(0);
    } },

  { id: "importancia", title: "Por qué es importante",
    html: () => `<h2>Importancia del tema</h2>${pares(IMPORTANCIA)}` },

  { id: "mitos", title: "Mitos y realidades",
    html: () => `
      <h2>Mitos y realidades</h2>
      <p>Lea cada afirmación y elija si es un mito o una realidad.</p>
      <div id="mitos-lista">
        ${MITOS.map((m, i) => `
          <section data-mito="${i}">
            <p><strong>${i + 1}. ${esc(m.mito)}</strong></p>
            <button data-resp="true">Es realidad</button>
            <button data-resp="false">Es mito</button>
            <p class="resultado" aria-live="polite"></p>
          </section>`).join("")}
      </div>
      <p id="mitos-puntaje"></p>`,
    init: () => {
      let correctas = 0, respondidas = 0;
      document.querySelectorAll("[data-mito]").forEach(sec => {
        const idx = +sec.dataset.mito;
        sec.querySelectorAll("[data-resp]").forEach(btn => btn.addEventListener("click", () => {
          if (sec.dataset.done) return;
          sec.dataset.done = "1";
          const resp = btn.dataset.resp === "true";
          const m = MITOS[idx];
          const ok = resp === m.real;

function initGame(root) {
  let idx = 0, score = 0, order = [], answered = false;

  const shuffle = (arr) => { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

  function start() {
    idx = 0; score = 0; answered = false;
    order = shuffle(PREGUNTAS.map((_, i) => i));
    root.innerHTML = `
      <p>Responde ${PREGUNTAS.length} preguntas. Cada respuesta correcta suma 10 puntos.</p>
      <button id="g-start">Comenzar juego</button>`;
    $("#g-start", root).addEventListener("click", render);
  }

  function render() {
    answered = false;
    const p = PREGUNTAS[order[idx]];
    root.innerHTML = `
      <p>Pregunta ${idx + 1} de ${PREGUNTAS.length} · Puntaje: <strong>${score}</strong></p>
      <h3>${esc(p.q)}</h3>
      <div id="g-opts">${p.o.map((t, i) => `<p><button data-opt="${i}">${String.fromCharCode(65 + i)}. ${esc(t)}</button></p>`).join("")}</div>
      <p id="g-fb" aria-live="polite"></p>
      <p><button id="g-next" hidden>${idx + 1 === PREGUNTAS.length ? "Ver resultado" : "Siguiente pregunta"}</button></p>`;
    root.querySelectorAll("[data-opt]").forEach(b => b.addEventListener("click", () => answer(+b.dataset.opt)));
    $("#g-next", root).addEventListener("click", next);
  }

  function answer(i) {
    if (answered) return;
    answered = true;
    const p = PREGUNTAS[order[idx]];
    const ok = i === p.a;
    if (ok) score += 10;
    $("#g-fb", root).textContent = (ok ? "¡Correcto! +10 puntos. " : `Incorrecto. La respuesta correcta era: ${p.o[p.a]}. `) + p.e;
    root.querySelectorAll("[data-opt]").forEach(b => b.disabled = true);
    $("#g-next", root).hidden = false;
  }

  function next() {
    idx++;
    if (idx >= PREGUNTAS.length) return finish();
    render();
  }

  function finish() {
    const max = PREGUNTAS.length * 10;
    const pct = Math.round((score / max) * 100);
    const msg = pct >= 80 ? "¡Excelente! Tienes muy buenos conocimientos."
      : pct >= 50 ? "¡Bien! Repasa los apartados para reforzar lo aprendido."
      : "Te recomendamos revisar los apartados y volver a intentarlo.";
    root.innerHTML = `
      <h3>Juego terminado</h3>
      <p>Puntaje final: <strong>${score} / ${max}</strong> (${pct} %)</p>
      <p>${msg}</p>
      <p><button id="g-again">Jugar de nuevo</button>
         <button data-go="signos">Repasar signos de alerta</button>
         <button data-go="mitos">Repasar mitos y realidades</button></p>`;
    $("#g-again", root).addEventListener("click", start);
    bindGo(root);
  }

  start();
}

/* =========================================================
   API (servicios públicos con CORS habilitado)
   ========================================================= */
const shuffle = (arr) => { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

function initApi() {
  const out = $("#api-out");
  const getJSON = async (u) => {
    const c = new AbortController(), t = setTimeout(() => c.abort(), 12000);
    try { const r = await fetch(u, { signal: c.signal }); if (!r.ok) throw new Error("HTTP " + r.status); return await r.json(); }
    finally { clearTimeout(t); }
  };
  const fail = (box, e) => { box.innerHTML = `<p>No se pudo cargar la información (${e.name === "AbortError" ? "tardó demasiado" : esc(e.message)}). Revisa tu conexión e intenta de nuevo.</p>`; };
  const loading = (box) => { box.innerHTML = "<p>Cargando...</p>"; };
  const chips = (list) => `<p>${list.map(([l, q]) => `<button data-q="${esc(q)}">${esc(l)}</button>`).join("")}</p>`;
  const wireChips = (run) => out.querySelectorAll("[data-q]").forEach(b => b.addEventListener("click", () => run(b.dataset.q)));

  // 1. Conceptos (Wikipedia en español)
  function concepts() {
    const lista = ["Mamografía", "Biopsia", "Mastectomía", "Quimioterapia", "Radioterapia", "BRCA1", "Linfedema"].map(t => [t, t]);
    out.innerHTML = `<h3>Explora un concepto</h3>
      <p>Toca un término o escribe el tuyo. Información de Wikipedia en español.</p>
      ${chips(lista)}
      <p><input type="text" id="q" placeholder="Ej.: tamoxifeno"> <button id="qgo">Buscar</button></p>
      <div id="res"></div>`;
    const res = $("#res");
    const run = async (term) => {
      if (!term) return;
      loading(res);
      try {
        const s = await getJSON(`https://es.wikipedia.org/w/api.php?action=opensearch&limit=1&format=json&origin=*&search=${encodeURIComponent(term)}`);
        const title = s[1]?.[0];
        if (!title) { res.innerHTML = "<p>Sin resultados. Prueba con otro término.</p>"; return; }
        const d = await getJSON(`https://es.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title)}`);
        res.innerHTML = `<h3>${esc(d.title)}</h3>
          ${d.thumbnail ? `<p><img src="${esc(d.thumbnail.source)}" alt="${esc(d.title)}"></p>` : ""}
          <p>${esc(d.extract)}</p>
          <p>Fuente: Wikipedia (es). <a href="${esc(d.content_urls?.desktop?.page || "#")}" target="_blank" rel="noopener">Ver artículo completo</a></p>
          <p><em>Contenido general; no reemplaza la orientación de un profesional de salud.</em></p>`;
      } catch (e) { fail(res, e); }
    };
    wireChips(run);
    $("#qgo").addEventListener("click", () => run($("#q").value.trim()));
    $("#q").addEventListener("keydown", (e) => { if (e.key === "Enter") run(e.target.value.trim()); });
    run("Mamografía");
  }

  // 2. Datos de pacientes (NCI Genomic Data Commons, proyecto TCGA-BRCA)
  function data() {
    const VARS = { "demographic.gender": "Sexo", "demographic.vital_status": "Estado vital",
      "diagnoses.ajcc_pathologic_stage": "Estadio patológico", "diagnoses.primary_diagnosis": "Tipo de tumor" };
    const TR = { female: "Mujer", male: "Hombre", alive: "Vivo/a", dead: "Fallecido/a", "not reported": "No reportado", _missing: "Sin dato" };
    out.innerHTML = `<h3>Explora datos reales de pacientes</h3>
      <p>Elige una variable y mira cómo se distribuyen los casos del proyecto TCGA-BRCA (Instituto Nacional del Cáncer, EE. UU.).</p>
      <p><label>Variable:
        <select id="var">${Object.entries(VARS).map(([k, l]) => `<option value="${k}">${l}</option>`).join("")}</select></label></p>
      <div id="res"></div>
      <p><em>Son datos de investigación de personas participantes en un proyecto de EE. UU.; no representan la frecuencia del cáncer de mama en una población ni sirven para estimar riesgo individual.</em></p>`;
    const res = $("#res");
    const run = async () => {
      const f = $("#var").value;
      loading(res);
      try {
        const filters = encodeURIComponent(JSON.stringify({ op: "in", content: { field: "project.project_id", value: ["TCGA-BRCA"] } }));
        const d = await getJSON(`https://api.gdc.cancer.gov/cases?size=0&facets=${f}&filters=${filters}`);
        const total = d.data.pagination.total;
        const rows = (d.data.aggregations[f]?.buckets || []).sort((a, b) => b.doc_count - a.doc_count).slice(0, 10);
        res.innerHTML = `<p>Casos analizados: <strong>${total}</strong>. Variable: <strong>${esc(VARS[f])}</strong></p>` +
          rows.map(r => {
            const k = String(r.key);
            const label = TR[k.toLowerCase()] || k.replace(/^stage /i, "Estadio ");
            return `<div class="fila"><span>${esc(label)}</span><progress value="${r.doc_count}" max="${total}"></progress><b>${r.doc_count} (${Math.round(r.doc_count / total * 100)} %)</b></div>`;
          }).join("") + "<p>Fuente: NCI Genomic Data Commons.</p>";
      } catch (e) { fail(res, e); }
    };
    $("#var").addEventListener("change", run);
    run();
  }

  // 3. Estudios clínicos por país (ClinicalTrials.gov)
  function trials() {
    const paises = [["Colombia", "Colombia"], ["Mexico", "México"], ["Chile", "Chile"], ["Spain", "España"], ["United States", "Estados Unidos"]];
    const estados = [["RECRUITING", "Reclutando participantes"], ["NOT_YET_RECRUITING", "Aún no reclutan"], ["COMPLETED", "Completados"]];
    const opts = (a) => a.map(([v, l]) => `<option value="${v}">${l}</option>`).join("");
    out.innerHTML = `<h3>Estudios clínicos sobre cáncer de mama</h3>
      <p>Los estudios clínicos son investigaciones que prueban nuevas formas de prevenir, detectar o tratar la enfermedad. Participar es voluntario y se decide con el equipo de salud.</p>
      <p><label>País: <select id="pais">${opts(paises)}</select></label>
         <label>Estado: <select id="est">${opts(estados)}</select></label></p>
      <div id="res"></div>`;
    const res = $("#res");
    const run = async () => {
      loading(res);
      try {
        const u = `https://clinicaltrials.gov/api/v2/studies?query.cond=${encodeURIComponent("breast cancer")}&query.locn=${encodeURIComponent($("#pais").value)}&filter.overallStatus=${$("#est").value}&pageSize=8&countTotal=true`;
        const d = await getJSON(u);
        const list = d.studies || [];
        if (!list.length) { res.innerHTML = "<p>No se encontraron estudios con esos filtros.</p>"; return; }
        res.innerHTML = `<p>Estudios encontrados: <strong>${esc(d.totalCount ?? list.length)}</strong> (mostrando ${list.length})</p><ol>` +
          list.map(s => {
            const p = s.protocolSection || {}, id = p.identificationModule?.nctId || "";
            return `<li><a href="https://clinicaltrials.gov/study/${esc(id)}" target="_blank" rel="noopener">${esc(p.identificationModule?.briefTitle || id)}</a><br>${esc(id)}</li>`;
          }).join("") + "</ol><p>Fuente: ClinicalTrials.gov (NIH, EE. UU.).</p>";
      } catch (e) { fail(res, e); }
    };
    $("#pais").addEventListener("change", run);
    $("#est").addEventListener("change", run);
    run();
  }

  // 4. Investigación científica (PubMed)
  function pubmed() {
    out.innerHTML = `<h3>Investigación científica de los últimos 5 años</h3>
      <p>Artículos de revistas científicas (PubMed, Biblioteca Nacional de Medicina de EE. UU.). Casi todos están en inglés. Toca un tema:</p>
      ${chips([["Prevención", "breast cancer prevention"], ["Detección temprana", "breast cancer early detection screening"], ["En hombres", "male breast cancer"], ["Colombia", "breast cancer Colombia"], ["Salud sexual", "breast cancer survivors sexual health"]])}
      <div id="res"></div>`;
    const res = $("#res");
    const run = async (t) => {
      loading(res);
      try {
        const q = encodeURIComponent(t);
        const s = await getJSON(`https://eutils.ncbi.nlm.nih.gov/entrez/eutils/esearch.fcgi?db=pubmed&retmode=json&retmax=8&sort=date&datetype=pdat&reldate=1825&term=${q}`);
        const ids = s.esearchresult?.idlist || [];
        if (!ids.length) { res.innerHTML = "<p>No se encontraron artículos.</p>"; return; }
        const m = await getJSON(`https://eutils.ncbi.nlm.nih.gov/entrez/eutils/esummary.fcgi?db=pubmed&retmode=json&id=${ids.join(",")}`);
        res.innerHTML = `<p>Artículos encontrados: <strong>${esc(s.esearchresult.count)}</strong> (mostrando los ${ids.length} más recientes)</p><ol>` +
          ids.map(id => { const a = m.result[id]; return `<li><a href="https://pubmed.ncbi.nlm.nih.gov/${esc(id)}/" target="_blank" rel="noopener">${esc(a.title)}</a><br>${esc(a.source)} · ${esc(a.pubdate)}</li>`; }).join("") +
          "</ol><p>Fuente: NCBI PubMed.</p>";
      } catch (e) { fail(res, e); }
    };
    wireChips(run);
    run("breast cancer prevention");
  }

  const tabs = { concepts, pubmed, trials, data };
  const botones = document.querySelectorAll("[data-api]");
  const abrir = (b) => { botones.forEach(x => x.classList.toggle("activa", x === b)); tabs[b.dataset.api](); };
  botones.forEach(b => b.addEventListener("click", () => abrir(b)));
  abrir(botones[0]);
}

const CAT = { R: "Factor de riesgo", P: "Factor protector", S: "Señal de alarma", N: "Mito / sin relación" };
const CLAS = [
  ["Consumo frecuente de alcohol", "R"], ["Actividad física regular", "P"], ["Bulto nuevo en la axila", "S"],
  ["Usar antitranspirante", "N"], ["Exceso de peso después de la menopausia", "R"], ["Lactancia materna", "P"],
  ["Secreción por el pezón de un solo lado", "S"], ["Usar sostén con varilla", "N"],
  ["Antecedentes familiares de cáncer de mama", "R"], ["Mantener un peso saludable", "P"],
  ["Hundimiento o enrojecimiento de la piel de la mama", "S"], ["Un golpe leve en la mama", "N"]
];

function initSort(root) {
  let order, i, score, streak;
  const start = () => { order = shuffle(CLAS); i = 0; score = 0; streak = 0; render(); };
  function render() {
    const [txt] = order[i];
    root.innerHTML = `
      <p>Elemento ${i + 1} de ${order.length} · Puntaje: <strong>${score}</strong> · Racha: <strong>${streak}</strong></p>
      <h3>${esc(txt)}</h3>
      <p>¿Dónde lo clasificas?</p>
      <div id="s-opts">${Object.entries(CAT).map(([k, l]) => `<button data-c="${k}">${l}</button>`).join("")}</div>
      <p id="s-fb" aria-live="polite"></p>
      <p><button id="s-next" hidden>${i + 1 === order.length ? "Ver resultado" : "Siguiente"}</button></p>`;
    root.querySelectorAll("[data-c]").forEach(b => b.addEventListener("click", () => answer(b.dataset.c)));
    $("#s-next", root).addEventListener("click", () => { i++; i >= order.length ? finish() : render(); });
  }
  function answer(c) {
    const right = order[i][1], ok = c === right;
    if (ok) { streak++; score += 10 + (streak >= 3 ? 5 : 0); } else streak = 0;
    $("#s-fb", root).textContent = ok ? `¡Correcto! Es: ${CAT[right]}.${streak >= 3 ? " ¡Bonus de racha +5!" : ""}` : `No exactamente. Es: ${CAT[right]}.`;
    root.querySelectorAll("[data-c]").forEach(b => b.disabled = true);
    $("#s-next", root).hidden = false;
  }
  function finish() {
    root.innerHTML = `<h3>Juego terminado</h3>
      <p>Puntaje final: <strong>${score}</strong> (máximo sin racha: ${order.length * 10})</p>
      <p>Repasa los apartados de factores de riesgo y señales de alerta para reforzar lo aprendido.</p>
      <p><button id="s-again">Jugar de nuevo</button> <button data-go="riesgo">Ver factores de riesgo</button> <button data-go="signos">Ver señales de alerta</button></p>`;
    $("#s-again", root).addEventListener("click", start);
    bindGo(root);
  }
  start();
}

        ${prev ? `<button data-go="${prev.id}">← Anterior</button>` : ""}
        <button data-go="inicio">Inicio</button>
        ${nxt ? `<button data-go="${nxt.id}">Siguiente →</button>` : ""}
      </nav>
      <p>Apartado ${pos + 1} de ${content.length}: ${esc(page.title)}</p>`;
  }

  app.innerHTML = miga + page.html() + controls;
  bindGo(app);
  if (page.init) page.init();
  renderNav();
  document.title = page.title + " | Cáncer de mama";
  history.replaceState(null, "", "#" + page.id);
  app.focus();
  window.scrollTo(0, 0);
}

window.addEventListener("hashchange", () => {
  const id = location.hash.slice(1);
  if (id && PAGES[current].id !== id) goTo(id);
});

goTo(location.hash.slice(1) || "inicio");
</script>
</body>
</html>
